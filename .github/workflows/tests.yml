name: Tests

on:
  pull_request:
  push:
    branches:
      - main

env:
  CI: true

permissions:
  contents: read

jobs:
  web-unit:
    name: web-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run web unit tests
        # Vitest loads artifacts/web/vite.config.ts, which throws when PORT or
        # BASE_PATH is unset. The values match the web-build job in ci.yml.
        env:
          PORT: "8080"
          BASE_PATH: /
        run: pnpm --filter ./artifacts/web test:unit

  db-pgtap:
    name: db-pgtap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking on purpose: a red check here means a pgTAP suite failed.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.95.4
      # Starts only the Postgres container, sets up the auth, storage, and
      # realtime schemas, and applies supabase/migrations in order. The pgTAP
      # suites need nothing else from the local stack.
      - name: Start local Postgres and apply migrations
        run: supabase db start
      - name: Run pgTAP suites
        run: supabase test db
